---
# File-based provisioning. This runs ON the Grafana host (not the API), drops a
# YAML file in /etc/grafana/provisioning/datasources/, and restarts Grafana.
# Add the Grafana host to a [grafana] inventory group first.
- name: Provision Grafana data sources from files
  hosts: grafana
  become: true
  vars:
    grafana_file_datasources:
      - name: Prometheus
        type: prometheus
        url: "http://localhost:9090"
        isDefault: true
      - name: InfluxDB
        type: influxdb
        url: "http://localhost:8086"
  tasks:
    - name: Template the data source provisioning file
      ansible.builtin.template:
        src: templates/datasources.yaml.j2
        dest: /etc/grafana/provisioning/datasources/datasources.yaml
        owner: root
        group: grafana
        mode: "0640"
      notify: Restart Grafana

  handlers:
    - name: Restart Grafana
      ansible.builtin.service:
        name: grafana-server
        state: restarted
