---
- name: Install dnf-plugins-core
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Install kernel-modules-extra (provides xt_addrtype for Docker on Rocky 10)
  ansible.builtin.dnf:
    name: "kernel-modules-extra-{{ ansible_kernel }}"
    state: present
  notify: Load xt_addrtype

- name: Add Docker CE repo
  ansible.builtin.command:
    cmd: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
    creates: /etc/yum.repos.d/docker-ce.repo

- name: Install Docker Engine and plugins
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure Python docker SDK is present (for ad-hoc module use)
  ansible.builtin.dnf:
    name: python3-pip
    state: present

- name: Install docker SDK and requests via pip
  ansible.builtin.pip:
    name:
      - docker
      - requests
    state: present
    extra_args: "--break-system-packages"
  failed_when: false
