---
# List transformation filters
- name: List filters
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    nums: [5, 1, 9, 1, 3, 9]
    servers:
      - { name: web01, role: web, cpu: 4 }
      - { name: web02, role: web, cpu: 8 }
      - { name: db01,  role: db,  cpu: 16 }
    a: [1, 2, 3, 4]
    b: [3, 4, 5, 6]
  tasks:
    - name: unique and sort
      ansible.builtin.debug:
        msg: "unique={{ nums | unique }} sorted={{ nums | unique | sort }}"

    - name: min max length
      ansible.builtin.debug:
        msg: "min={{ nums | min }} max={{ nums | max }} count={{ nums | length }}"

    - name: map extracts one attribute from every dict
      ansible.builtin.debug:
        msg: "{{ servers | map(attribute='name') | list }}"

    - name: selectattr filters dicts by an attribute test
      ansible.builtin.debug:
        msg: "{{ servers | selectattr('role', 'equalto', 'web') | map(attribute='name') | list }}"

    - name: rejectattr is the inverse
      ansible.builtin.debug:
        msg: "{{ servers | rejectattr('cpu', 'lt', 8) | map(attribute='name') | list }}"

    - name: set algebra across two lists
      ansible.builtin.debug:
        msg: >-
          union={{ a | union(b) }}
          intersect={{ a | intersect(b) }}
          difference={{ a | difference(b) }}

    - name: zip pairs two lists, flatten collapses nesting
      ansible.builtin.debug:
        msg: >-
          zip={{ ['web', 'db'] | zip([80, 5432]) | list }}
          flat={{ [[1, 2], [3, [4]]] | flatten }}
